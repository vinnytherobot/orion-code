services:
  postgres:
    image: postgres:16-alpine
    container_name: orion-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
      POSTGRES_DB: orion
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/infrastructure/src/db/seeds/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orion-api
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://orion:orion@localhost:5432/orion
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ORION_PROVIDER: ${ORION_PROVIDER:-ollama}
      ORION_PROVIDER_API_KEY: ${ORION_PROVIDER_API_KEY:-}
      ORION_OLLAMA_BASE_URL: ${ORION_OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      ORION_OPENAI_API_KEY: ${ORION_OPENAI_API_KEY:-}
      ORION_OPENAI_BASE_URL: ${ORION_OPENAI_BASE_URL:-}
      ORION_OPENAI_MODEL: ${ORION_OPENAI_MODEL:-}
      ORION_ANTHROPIC_API_KEY: ${ORION_ANTHROPIC_API_KEY:-}
      ORION_ANTHROPIC_BASE_URL: ${ORION_ANTHROPIC_BASE_URL:-}
      ORION_ANTHROPIC_MODEL: ${ORION_ANTHROPIC_MODEL:-}
      ORION_GROQ_API_KEY: ${ORION_GROQ_API_KEY:-}
      ORION_GROQ_BASE_URL: ${ORION_GROQ_BASE_URL:-}
      ORION_GROQ_MODEL: ${ORION_GROQ_MODEL:-}
      ORION_PROJECT_PATH: /app/project
    volumes:
      - .:/app/project
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
